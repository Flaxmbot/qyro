[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qyro"
version = "2.0.0"
description = "The Universal Polyglot Runtime - Write Python, C, Rust, Java in one file with shared state"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Qyro Team", email = "team@qyro.dev"},
]
maintainers = [
    {name = "Qyro Maintainers", email = "maintainers@qyro.dev"},
]
keywords = ["polyglot", "shared-state", "ipc", "ffi", "multi-language", "runtime", "cross-platform", "kafka", "microservices", "animation", "rich", "art"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Distributed Computing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
requires-python = ">=3.8"

# Core dependencies (always installed)
dependencies = [
    "click>=8.0",
    "colorama>=0.4",
    "typing-extensions>=4.0",
    "redis>=5.0.0",
    "docker>=7.0",
    "psutil>=5.8.0",
    "confluent-kafka>=2.0.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=11.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=23.0",
    "aiokafka>=0.10.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "questionary>=2.0",
    "art>=6.0",
    "pyfiglet>=1.0",
]

# Optional feature dependencies
[project.optional-dependencies]
redis = [
    "redis>=5.0.0"
]
gateway = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=11.0"
]
ui = [
    "rich>=13.0",
    "questionary>=2.0"
]
docker = [
    "docker>=7.0"
]
kafka = [
    "confluent-kafka>=2.0.0",
    "aiokafka>=0.10.0"
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1"
]
animation = [
    "rich>=13.0",
    "art>=6.0",
    "pyfiglet>=1.0"
]
full = [
    "qyro[redis,gateway,ui,docker,kafka,animation]"
]

[project.scripts]
qyro = "qyro.cli.cli:main"

[project.urls]
Homepage = "https://github.com/qyro-dev/qyro"
Documentation = "https://qyro.dev/docs"
Repository = "https://github.com/qyro-dev/qyro"
Changelog = "https://github.com/qyro-dev/qyro/releases"
"Bug Tracker" = "https://github.com/qyro-dev/qyro/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qyro*"]
namespaces = false

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests"
]