[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qyro"
version = "3.0.0"
description = "The Minimalist Polyglot Runtime for SaaS"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Qyro Team", email = "team@qyro.dev"},
]
requires-python = ">=3.9"

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "pyfiglet>=1.0",
    "docker>=7.0",
    "pydantic>=2.0",
    "watchdog>=3.0.0"
]

[project.scripts]
qyro = "qyro.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["qyro*"]
