<svg width="600" height="150" viewBox="0 0 600 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00ff9d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00aa;stop-opacity:1" />
    </linearGradient>
    <style>
      @keyframes pulse {
        0% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
        100% { opacity: 0.8; transform: scale(1); }
      }
      .title {
        font-family: 'Courier New', monospace;
        font-weight: bold;
        font-size: 80px;
        fill: url(#grad1);
        animation: pulse 3s infinite ease-in-out;
        transform-origin: center;
      }
      .subtitle {
        font-family: sans-serif;
        font-size: 20px;
        fill: #aaaaaa;
        letter-spacing: 5px;
      }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" class="title">Q Y R O</text>
  <text x="50%" y="90%" dominant-baseline="middle" text-anchor="middle" class="subtitle">THE UNIVERSAL POLYGLOT RUNTIME</text>
</svg>
