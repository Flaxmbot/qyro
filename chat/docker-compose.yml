
version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - qyro-net

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - qyro-net

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - qyro-net


  ui:
    build: ./ui
    networks:
      - qyro-net
    depends_on:
      - redis
      - kafka

    ports:
      - "3000-3010:3000"
    stdin_open: true
    tty: true

  backend:
    build: ./backend
    networks:
      - qyro-net
    depends_on:
      - redis
      - kafka

    ports:
      - "8000-8010:8000"

  filter:
    build: ./filter
    networks:
      - qyro-net
    depends_on:
      - redis
      - kafka

  archiver:
    build: ./archiver
    networks:
      - qyro-net
    depends_on:
      - redis
      - kafka


networks:
  qyro-net:
    driver: bridge
