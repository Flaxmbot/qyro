<!-- src/adapters/language_adapters/web/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Web Adapter</title>
    <link rel="stylesheet" href="nexus-styles.css">
    <title>Nexus Polyglot Runtime - Web Interface</title>
</head>
<body>
    <div id="root">
        <div class="nexus-container">
            <div class="nexus-header">
                <h1>Nexus Web Adapter</h1>
                <p>Connect to the polyglot runtime from the browser</p>
            </div>
            
            <div class="nexus-status-bar">
                <div id="status">Connecting...</div>
                <div id="module-name">Module: web_client</div>
            </div>
            
            <div id="state-display" class="nexus-state-display">
                <h3>Current State</h3>
                <div id="state-content">Loading...</div>
            </div>
            
            <div class="nexus-form">
                <input type="text" id="field-name" class="nexus-input" placeholder="Field name">
                <input type="text" id="field-value" class="nexus-input" placeholder="Field value">
                <button id="update-btn" class="nexus-button">Update Field</button>
                <button id="increment-btn" class="nexus-button">Increment</button>
            </div>
            
            <div class="nexus-function-call">
                <input type="text" id="function-name" class="nexus-input" placeholder="Function name">
                <input type="text" id="function-args" class="nexus-input" placeholder='Arguments (JSON)'>
                <button id="call-function-btn" class="nexus-button">Call Function</button>
            </div>
            
            <div id="messages">
                <!-- Dynamic messages will appear here -->
            </div>
        </div>
    </div>

    <script src="nexus-client.js"></script>
    <script>
        // Initialize Nexus client
        const nexus = new NexusClient({
            moduleName: 'web_client',
            gatewayUrl: 'ws://localhost:8765/ws'
        });

        // DOM elements
        const statusEl = document.getElementById('status');
        const stateContentEl = document.getElementById('state-content');
        const fieldNameEl = document.getElementById('field-name');
        const fieldValueEl = document.getElementById('field-value');
        const updateBtn = document.getElementById('update-btn');
        const incrementBtn = document.getElementById('increment-btn');
        const functionNameEl = document.getElementById('function-name');
        const functionArgsEl = document.getElementById('function-args');
        const callFunctionBtn = document.getElementById('call-function-btn');
        const messagesEl = document.getElementById('messages');

        // Update status display
        nexus.subscribeToChanges((newState) => {
            statusEl.innerHTML = nexus.connected ? 
                '<span class="nexus-status-connected">Connected</span>' : 
                '<span class="nexus-status-disconnected">Disconnected</span>';
            
            stateContentEl.innerHTML = '<pre>' + JSON.stringify(newState, null, 2) + '</pre>';
        });

        // Update field button
        updateBtn.addEventListener('click', async () => {
            const fieldName = fieldNameEl.value.trim();
            const fieldValue = fieldValueEl.value.trim();
            
            if (fieldName && fieldValue) {
                try {
                    // Try to parse as JSON, otherwise treat as string
                    let parsedValue;
                    try {
                        parsedValue = JSON.parse(fieldValue);
                    } catch {
                        parsedValue = fieldValue;
                    }
                    
                    await nexus.updateField(fieldName, parsedValue);
                    addMessage(`Updated field '${fieldName}' to ${JSON.stringify(parsedValue)}`, 'success');
                } catch (error) {
                    addMessage(`Error updating field: ${error.message}`, 'error');
                }
            }
        });

        // Increment field button
        incrementBtn.addEventListener('click', async () => {
            const fieldName = fieldNameEl.value.trim();
            
            if (fieldName) {
                try {
                    const result = await nexus.incrementField(fieldName, 1);
                    addMessage(`Incremented field '${fieldName}' to ${result}`, 'success');
                } catch (error) {
                    addMessage(`Error incrementing field: ${error.message}`, 'error');
                }
            }
        });

        // Call function button
        callFunctionBtn.addEventListener('click', async () => {
            const functionName = functionNameEl.value.trim();
            const functionArgs = functionArgsEl.value.trim();
            
            if (functionName) {
                try {
                    let parsedArgs = {};
                    if (functionArgs) {
                        parsedArgs = JSON.parse(functionArgs);
                    }
                    
                    const result = await nexus.callRemoteFunction(functionName, parsedArgs);
                    addMessage(`Called function '${functionName}', result: ${JSON.stringify(result)}`, 'success');
                } catch (error) {
                    addMessage(`Error calling function: ${error.message}`, 'error');
                }
            }
        });

        // Helper function to add messages
        function addMessage(text, type = 'info') {
            const messageEl = document.createElement('div');
            messageEl.className = `nexus-${type}`;
            messageEl.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
            messagesEl.appendChild(messageEl);
            
            // Auto-remove message after 5 seconds
            setTimeout(() => {
                messageEl.remove();
            }, 5000);
        }

        // Initialize
        setInterval(async () => {
            const currentState = await nexus.readState();
            stateContentEl.innerHTML = '<pre>' + JSON.stringify(currentState, null, 2) + '</pre>';
        }, 2000);
    </script>
</body>
</html>
