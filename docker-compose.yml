version: '3.8'

services:
  # Redis for state management and pub/sub
  redis:
    image: redis:7-alpine
    container_name: qyro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qyro-network

  # Kafka for distributed messaging
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: qyro-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - qyro-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: qyro-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - qyro-network

  # Qyro Orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: qyro/orchestrator/Dockerfile
    container_name: qyro-orchestrator
    ports:
      - "8000:8000"
    environment:
      - QYRO_REDIS_HOST=redis
      - QYRO_REDIS_PORT=6379
      - QYRO_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - QYRO_MODE=docker
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - qyro-network
    restart: unless-stopped

  # Qyro Gateway (optional, for API gateway functionality)
  gateway:
    build:
      context: .
      dockerfile: qyro/gateway/Dockerfile
    container_name: qyro-gateway
    ports:
      - "8001:8000"
    environment:
      - QYRO_ORCHESTRATOR_URL=http://orchestrator:8000
      - QYRO_REDIS_HOST=redis
      - QYRO_REDIS_PORT=6379
    depends_on:
      - orchestrator
      - redis
    networks:
      - qyro-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  qyro-network:
    driver: bridge
